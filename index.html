<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMNAUTRONICS | Bağlantılar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #05070d;
    --bg-2: #0c1730;
    --line: rgba(255, 255, 255, 0.14);
    --line-strong: rgba(255, 255, 255, 0.4);
    --panel: rgba(255, 255, 255, 0.035);
    --text: #f4f6fa;
    --muted: #7c89ab;
    --live: #4fd1a5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px 40px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 50% -10%, var(--bg-2), var(--bg-1) 60%);
    background-color: var(--bg-1);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 800px 500px at 50% 0%, black, transparent 70%);
    pointer-events: none;
  }

  main {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .mark-wrap {
    position: relative;
    width: 229px;
    height: 229px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ping {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    animation: ping 3.2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }

  .ping.delay { animation-delay: 1.6s; }

  @keyframes ping {
    0%   { transform: scale(0.55); opacity: 0.55; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ping { animation: none; opacity: 0; }
  }

  .mark {
    width: 150px;
    height: 150px;
    position: relative;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(1.9rem, 6vw, 2.3rem);
    letter-spacing: -0.01em;
    text-align: center;
    margin: 0 0 12px;
  }

  p.tagline {
    text-align: center;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.55;
    margin: 0 auto 44px;
    max-width: 300px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  a.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 20px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  a.link:hover, a.link:focus-visible {
    border-color: var(--line-strong);
    background: rgba(255, 255, 255, 0.06);
    transform: translateY(-2px);
  }

  a.link .text { display: flex; flex-direction: column; gap: 2px; }

  a.link .label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 1.03rem;
  }

  a.link .sub {
    color: var(--muted);
    font-size: 0.84rem;
  }

  a.link .go {
    color: var(--muted);
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  a.cta {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg-1);
  }

  a.cta .label { font-weight: 700; }
  a.cta .sub { color: #4a5063; display: flex; align-items: center; gap: 6px; }
  a.cta .go { color: var(--bg-1); }

  a.cta .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live);
    flex-shrink: 0;
  }

  a.cta:hover, a.cta:focus-visible {
    background: #ffffff;
    border-color: #ffffff;
    transform: translateY(-2px);
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 46px;
    letter-spacing: 0.02em;
  }
</style>
</head>
